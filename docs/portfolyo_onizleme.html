<style>/* Consumer shopping audit — shared look with setosfk.github.io (IBM Plex, paper/ink, one accent). */






:root {
  color-scheme: light;
  --bg: #f5f2ec; --surface: #fffdf8; --surface-2: #eee8de; --ink: #1a1612; --ink-2: #453d35; --muted: #6d6358;
  --line: #e2d9cf; --accent: #2d6a8f; --accent-2: #4d8bb0; --accent-soft: rgba(45, 106, 143, .09);
  --neutral-mark: #a79ea0; --good: #2f6b4f; --alt: #6b7b8c; --land: #ece4d6; --land-line: #cbbba3;
  --s0: #6e3310; --s1: #9b2c48; --s2: #6f9a7a; --s3: #d49a2a;
  --shadow: 0 1px 2px rgba(27, 20, 22, .05), 0 12px 32px -20px rgba(27, 20, 22, .35);
  --f: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --m: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark; --bg: #141113; --surface: #1c181a; --surface-2: #262023; --ink: #f1ebe6; --ink-2: #d4cbc6;
  --muted: #a3999b; --line: #342c2f; --accent: #7fb6d9; --accent-2: #a9d0ea; --accent-soft: rgba(127, 182, 217, .13);
  --neutral-mark: #6d6366; --good: #7cc4a0; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 32px -20px rgba(0, 0, 0, .9); --alt: #9aa9b8; --land: #2a2426; --land-line: #463c3f; --s0: #d9824a; --s1: #e0708d; --s2: #8fc4a0; --s3: #f0c060; } }
:root[data-theme="dark"] {
  color-scheme: dark; --bg: #141113; --surface: #1c181a; --surface-2: #262023; --ink: #f1ebe6; --ink-2: #d4cbc6;
  --muted: #a3999b; --line: #342c2f; --accent: #7fb6d9; --accent-2: #a9d0ea; --accent-soft: rgba(127, 182, 217, .13);
  --neutral-mark: #6d6366; --good: #7cc4a0; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 14px 32px -20px rgba(0, 0, 0, .9); --alt: #9aa9b8; --land: #2a2426; --land-line: #463c3f; --s0: #d9824a; --s1: #e0708d; --s2: #8fc4a0; --s3: #f0c060; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f); }
a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
button, input, select { font: inherit; color: inherit; }
.muted { color: var(--muted); } .mono { font-family: var(--m); } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1180px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
.brand { font-weight: 600; text-decoration: none; }
.crumb { font: .74rem var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sp { flex: 1; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 32px; padding: 0 12px; cursor: pointer; font: .8rem var(--m); }
.pill:hover { border-color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* layout */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 80px; }
.hero { padding: 40px 0 18px; display: grid; gap: 12px; }
.kicker { font: .74rem var(--m); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.kicker b { color: var(--accent); font-weight: 400; }
h1 { font-size: clamp(1.9rem, 4.2vw, 3rem); line-height: 1.08; margin: 0; letter-spacing: -.02em; max-width: 24ch; }
.lede { font-size: clamp(1.02rem, 1.5vw, 1.18rem); color: var(--ink-2); max-width: 66ch; margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 30px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--ink); border-radius: 4px var(--r) var(--r) var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.kpi.hi { border-top-color: var(--accent); }
.kpi .l { font: .7rem var(--m); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 600; line-height: 1.15; margin: 4px 0 2px; }
.kpi.hi .v { color: var(--accent); }
.kpi .c { font-size: .84rem; color: var(--muted); line-height: 1.35; }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

section.block { margin: 34px 0; }
h2 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* explorer */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.explorer { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
@media (max-width: 960px) { .explorer { grid-template-columns: 1fr; } }
.panel { padding: 16px; }
.search { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 14px; }
.search:focus { outline: 2px solid var(--accent); }
.results { list-style: none; margin: 10px 0 0; padding: 0; max-height: 440px; overflow: auto; }
.results li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.results li button:hover, .results li button[aria-current="true"] { background: var(--accent-soft); }
.results .nm { flex: 1; min-width: 0; }
.results .meta { font: .78rem var(--m); color: var(--muted); white-space: nowrap; }
.fam { margin: 10px 0 4px; font: .7rem var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: .86rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.static { cursor: default; }
.chip.praise { border-style: dashed; color: var(--muted); }

.meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin: 6px 0; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; }
.big { font-size: 2.2rem; font-weight: 600; line-height: 1; }

.detail { padding: 18px; min-height: 420px; }
.detail h3 { font-size: 1.35rem; margin: 0; line-height: 1.2; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.score { font-size: 2rem; font-weight: 600; }
.badge { font: .72rem var(--m); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.badge.hi { background: var(--accent); color: #fff; border-color: var(--accent); }
.vintages { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.sec h4 { margin: 0 0 8px; font-size: .78rem; font-family: var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.mini b { display: block; }
.mini .s { font-size: .84rem; color: var(--muted); }
.mini.tr { border-left: 3px solid var(--accent); }
.note { font-size: .84rem; color: var(--muted); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.btn.ghost { background: none; color: var(--accent); }
select { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); padding: 0 10px; }
.shops { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.shops li { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px dashed var(--line); padding: 6px 0; }
.shops .d { font: .8rem var(--m); color: var(--muted); min-width: 64px; }
.empty { color: var(--muted); padding: 40px 10px; text-align: center; }

/* charts */
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
.chart { padding: 14px 16px; }
.chart h3 { margin: 0; font-size: 1rem; }
.chart p { margin: 2px 0 8px; font-size: .86rem; color: var(--muted); }
svg text { fill: var(--ink-2); font: 12px var(--f); }
svg .ax { stroke: var(--line); }
svg .mk { fill: var(--accent); }
svg .mk.n { fill: var(--neutral-mark); }
svg .bar { fill: var(--accent); }
svg .bar.n { fill: var(--neutral-mark); }
svg .guide { stroke: var(--line); stroke-width: 2; }
svg .hit { fill: transparent; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .82rem; padding: 6px 9px; border-radius: 6px; z-index: 50; opacity: 0; transition: opacity .12s; max-width: 280px; }
details.tbl summary { cursor: pointer; font-size: .84rem; color: var(--muted); margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
td, th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }

.boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
@media (max-width: 800px) { .boxes { grid-template-columns: 1fr; } }
.box { padding: 14px 18px; }
.box h3 { margin: 0 0 6px; font-size: 1rem; }
.box.warn { border-left: 3px solid var(--accent); }
.box li { margin: 4px 0; }
footer { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; font-size: .88rem; color: var(--ink-2); }
footer b { display: block; font: .72rem var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
pre { background: var(--surface-2); padding: 8px 10px; border-radius: 8px; overflow: auto; font: .78rem var(--m); }

/* age gate */
dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); max-width: 420px; padding: 22px; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(20, 17, 19, .55); backdrop-filter: blur(3px); }

/* atlas map, sliders, legends */
svg.map { width: 100%; height: auto; max-height: 560px; display: block; margin: 8px 0 12px; }
svg.map .land { fill: var(--land); stroke: var(--land-line); stroke-width: 1; }
svg.map .dot { stroke: var(--ink-2); stroke-width: 1; cursor: pointer; transition: r .15s; }
svg.map .dot.tr { stroke: var(--ink); stroke-width: 2.6; }
svg.map .dot.sel { stroke: var(--ink); stroke-width: 3.5; }
svg.map .dot:hover { stroke-width: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid var(--line); }
.legend i.ring { background: transparent; border: 2.6px solid var(--ink); }
.results.short { max-height: 260px; }
.sliders { display: grid; grid-template-columns: 1fr; gap: 6px; margin-top: 14px; }
.sliders label { display: grid; grid-template-columns: 116px 1fr 22px; gap: 10px; align-items: center; font-size: .9rem; }
.sliders input[type=range] { width: 100%; accent-color: var(--accent); }
.prof { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; font-size: .86rem; }
.prof .meter { margin: 0; position: relative; overflow: visible; }
.prof .meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; border-radius: 1px; }
button.mini { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
button.mini:hover { border-color: var(--accent); }
ul.plain { list-style: none; padding: 0; margin: 6px 0 0; font-size: .9rem; }
ul.plain li { padding: 3px 0; border-bottom: 1px dashed var(--line); }
ul.plain .mono { display: inline-block; min-width: 2.2em; color: var(--accent); font-weight: 600; }
.linkish { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
.scroll { overflow-x: auto; }
th button.th { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; cursor: pointer; }
svg .lab { font-size: 11px; fill: var(--ink); }
svg .tick { font-size: 11px; fill: var(--muted); }
svg .pt { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
svg .bar.alt { fill: var(--alt); opacity: .75; }
svg .guide.dash { stroke-dasharray: 4 4; }
.shelf-wrap { max-height: 520px; overflow: auto; }
.shelf-wrap thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
@media (min-width: 961px) { .explorer > .panel { position: sticky; top: 64px; } svg.map { max-height: 470px; } .results.short { max-height: 190px; } }
svg .iqr { stroke: var(--neutral-mark); stroke-width: 8; stroke-linecap: round; opacity: .55; }

/* oulad text-to-sql demo */
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; font-size: .92rem; color: var(--ink-2); max-width: 74ch; }
.qs { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
.qs .chip { font-size: .92rem; padding: 6px 12px; }
.qs .chip.bad { border-style: dashed; }
.demo { padding: 18px; display: grid; gap: 14px; }
.demo pre { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font: .84rem/1.5 var(--m); white-space: pre-wrap; overflow-x: auto; }
.demo h4 { margin: 0 0 6px; font: .72rem var(--m); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl th, .tbl td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font: .74rem var(--m); color: var(--muted); background: var(--surface-2); }
.tbl tr:last-child td { border-bottom: 0; }
.badge.ok { border-color: var(--good); color: var(--good); }
.badge.no { border-color: var(--s1); color: var(--s1); }
.ask { font-size: 1.1rem; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); }
.sumtbl { margin-top: 10px; }
</style>
</head>
